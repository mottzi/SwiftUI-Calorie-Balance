<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Count.kcal for Apple Watch</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#092d42;font:16px -apple-system,BlinkMacSystemFont,"Avenir Next",sans-serif}body.dark{background:#07131f;color:#edf5fa}main{max-width:1920px;margin:auto}video{display:block;width:100%;height:auto;aspect-ratio:16/9}nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:24px 5.5%;border-top:1px solid #94aabc55}a{color:inherit;text-underline-offset:5px}button{font:inherit;cursor:pointer;padding:12px 20px;border-radius:30px;background:transparent;color:inherit;border:1px solid #94aabc}button[aria-pressed=true]{background:#092d42;color:white}body.dark button[aria-pressed=true]{background:#edf5fa;color:#092d42}a:focus-visible,button:focus-visible{outline:3px solid #268ef2;outline-offset:5px}small{display:block;color:#8194a3;padding:0 5.5% 30px}</style>
<main><video id="hero" muted loop playsinline controls preload="metadata" poster="stills/count-kcal-watch-light-now-4k.png" aria-label="Count.kcal for Apple Watch. The calorie ring slowly changes from Now to the Midnight estimate and back, repeating continuously."><source src="video/count-kcal-watch-light-hero-4k.mp4" type="video/mp4"></video><nav><button id="play">Play animation</button><button id="light" aria-pressed="true">Light background</button><button id="dark" aria-pressed="false">Dark background</button><a id="download-video" href="video/count-kcal-watch-light-hero-4k.mp4" download>4K video</a><a id="download-png" href="stills/count-kcal-watch-light-now-4k.png" download>4K graphic</a><a id="download-svg" href="stills/count-kcal-watch-light-now.svg" download>Editable SVG</a><a href="video/watch-screen-now-midnight-loop.mp4" download>Screen-only loop</a><a id="framed" href="video/watch-framed-light-loop.mp4" download>Watch-only loop</a></nav><small>Original Apple Watch Series 11 bezel. Native app views with demo data. Apple and Apple Watch are trademarks of Apple Inc.</small></main>
<script>const v=document.querySelector('video'),play=document.querySelector('#play');let theme='light';play.onclick=()=>v.paused?v.play():v.pause();v.onplay=()=>play.textContent='Pause animation';v.onpause=()=>play.textContent='Play animation';for(const name of ['light','dark'])document.getElementById(name).onclick=()=>{if(theme===name)return;theme=name;const t=v.currentTime,playing=!v.paused;document.body.classList.toggle('dark',name==='dark');for(const n of ['light','dark'])document.getElementById(n).setAttribute('aria-pressed',String(n===name));v.poster=`stills/count-kcal-watch-${name}-now-4k.png`;v.src=`video/count-kcal-watch-${name}-hero-4k.mp4`;v.onloadedmetadata=()=>{v.currentTime=Math.min(t,9.9);if(playing)v.play().catch(()=>{});};document.querySelector('#download-video').href=v.src;document.querySelector('#download-png').href=v.poster;document.querySelector('#download-svg').href=`stills/count-kcal-watch-${name}-now.svg`;document.querySelector('#framed').href=`video/watch-framed-${name}-loop.mp4`;};if(!matchMedia('(prefers-reduced-motion: reduce)').matches)v.play().catch(()=>{});</script></html>

<script>
"use strict";
const cfg=JSON.parse(document.querySelector('#motion-config').textContent),canvas=document.querySelector('#art'),ctx=canvas.getContext('2d',{alpha:true}),wrap=document.querySelector('#composition');
const renderedFallback=/AppleWebKit/.test(navigator.userAgent)&&!/Chrome|Chromium|Edg\//.test(navigator.userAgent);
const video=document.createElement('video');video.muted=true;video.playsInline=true;video.loop=true;video.preload='auto';
let mediaLayout='',resumeTime=0,pendingLoad=true;
if(renderedFallback){video.style.cssText='display:block;width:100%;height:auto';video.setAttribute('aria-label',canvas.getAttribute('aria-label'));canvas.before(video);canvas.style.display='none'}
const poster=new Image();poster.src=cfg.nowPoster;
const playButton=document.querySelector('#play'),range=document.querySelector('#timeline'),clock=document.querySelector('#time'),choice=document.querySelector('#layout'),params=new URLSearchParams(location.search),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let playing=!params.has('paused')&&!reduced.matches,visible=true,ready=false,raf=0,layoutName='wide';resumeTime=Math.min(7.999,Math.max(0,Number(params.get('t')||0)));
function smooth(p){p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)}

function text(s,x,y,size,weight,col,alpha=1,align='left'){ctx.save();ctx.globalAlpha=alpha;ctx.font=weight+' '+size+'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore()}
function dot(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function line(x1,y1,x2,y2,w,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function draw(){
 const t=ready?video.currentTime:0,l=cfg.layouts[layoutName],p=progress(t),mix=smooth((t-1.4)/.3)*(1-smooth((t-5.98)/.25));
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(renderedFallback){updateControls(t,p);return}
 text('Count.kcal',l.brand[0],l.brand[1],l.brand[2],600,cfg.white);
 l.heading.lines.forEach((s,i)=>text(s,l.heading.x,l.heading.y+i*l.heading.leading,l.heading.size,600,cfg.white));
 const cp=l.caption;
 for(const projection of [false,true]){
  const alpha=projection?mix:1-mix;if(alpha<.001)continue;
  const lines=projection?['Your projected','balance tonight.']:['Your balance','right now.'];
  if(layoutName==='wide')lines.forEach((s,i)=>text(s,cp[0],cp[1]+i*cp[3],cp[2],400,cfg.muted,alpha));
  else text(projection?'Your projected balance tonight.':'Your balance right now.',cp[0],cp[1],cp[2],400,cfg.muted,alpha);
 }
 const box=l.card;ctx.save();ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=24;ctx.shadowOffsetY=14;
 if(ready&&video.readyState>=2)ctx.drawImage(video,box[0],box[1],box[2],box[2]/cfg.cardAspect);
 else if(poster.complete&&poster.naturalWidth)ctx.drawImage(poster,box[0],box[1],box[2],box[2]/cfg.cardAspect);
 ctx.restore();
 const m=l.mode;dot(m[0]+5,m[1]-8,5,cfg.blue);text('Now',m[0]+25,m[1],m[2],500,cfg.blue,1-mix);text('Midnight projection',m[0]+25,m[1],m[2],500,cfg.blue,mix);
 const tl=l.timeline,x1=tl[0],x2=tl[1],y=tl[2],mx=x1+(x2-x1)*p;
 line(x1,y,x2,y,5,cfg.track);if(p>0)line(x1,y,mx,y,5,cfg.blue);
 for(let k=1;k<8;k++){const x=x1+(x2-x1)*k/8;line(x,y-5,x,y+5,2,'#65717f',.35)}
 dot(x1,y,6,cfg.blue);dot(x2,y,6,p>.99?cfg.blue:cfg.track);dot(mx,y,25,cfg.blue,.1);dot(mx,y,15,cfg.blue,.24);dot(mx,y,8,cfg.white);
 text('Now',x1,y+55,tl[3],500,p<.5?cfg.white:cfg.muted);text('Midnight',x2,y+55,tl[3],500,p>=.5?cfg.white:cfg.muted,1,'right');

}
function updateControls(t,p){
 range.value=t;clock.value=t.toFixed(1)+' / 8 s';
 document.querySelector('#now').setAttribute('aria-pressed',String(p===0));document.querySelector('#midnight').setAttribute('aria-pressed',String(p===1));
 document.body.dataset.time=t.toFixed(3);document.body.dataset.layout=layoutName;
}
function schedule(){if(!raf&&ready&&playing&&visible&&!document.hidden)raf=requestAnimationFrame(tick)}
function tick(){raf=0;draw();schedule()}
function syncPlayback(){
 playButton.textContent=playing?'Pause':'Play';playButton.setAttribute('aria-pressed',String(playing));
 if(ready&&playing&&visible&&!document.hidden){video.play().then(schedule).catch(()=>{playing=false;syncPlayback()})}
 else{video.pause();if(raf){cancelAnimationFrame(raf);raf=0}draw()}
}
function seek(t){playing=false;syncPlayback();if(ready)video.currentTime=Math.max(0,Math.min(7.999,t))}
function resize(){
 const selection=choice.value;layoutName=selection==='auto'?(document.querySelector('main').clientWidth<760?'mobile':'wide'):selection;wrap.style.maxWidth=selection==='mobile'?'390px':'1200px';const l=cfg.layouts[layoutName];canvas.width=l.width;canvas.height=l.height;
 const requested=renderedFallback?layoutName:'source';
 if(requested!==mediaLayout){
  if(ready)resumeTime=video.currentTime;ready=false;pendingLoad=true;mediaLayout=requested;
  if(renderedFallback)video.poster='../stills/count-kcal-now-midnight-explainer-'+layoutName+'-poster-transparent.png';
  video.src=renderedFallback?'../videos/count-kcal-now-midnight-explainer-'+layoutName+'-dark-bg.mp4':cfg.cardSource;video.load();
 }
 draw();
}
playButton.onclick=()=>{playing=!playing;syncPlayback()};range.oninput=()=>seek(Number(range.value));document.querySelector('#now').onclick=()=>seek(0);document.querySelector('#midnight').onclick=()=>seek(3.5);
choice.onchange=resize;if(['wide','mobile'].includes(params.get('layout')))choice.value=params.get('layout');
new ResizeObserver(resize).observe(document.querySelector('main'));
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;syncPlayback()},{threshold:.25}).observe(renderedFallback?video:canvas);
document.addEventListener('visibilitychange',syncPlayback);reduced.addEventListener('change',e=>{if(e.matches)seek(0)});
video.addEventListener('loadeddata',()=>{if(!pendingLoad)return;pendingLoad=false;ready=true;document.body.dataset.ready='true';video.currentTime=resumeTime;syncPlayback();draw()});
video.addEventListener('seeked',draw);poster.onload=draw;
video.addEventListener('error',()=>{playing=false;ready=false;syncPlayback();document.querySelector('#note').textContent='This browser could not play the source video. Use the dark-background MP4 exports to view the finished animation.'});
resize();draw();

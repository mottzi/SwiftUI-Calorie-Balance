<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Count.kcal · Your day, brought together</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#060709;color:#eeeeef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(1440px,100%,calc((100dvh - 130px)*18/11))}.stage{width:100%;aspect-ratio:18/11;background:#060709}.stage.transparent{background:repeating-conic-gradient(#111217 0% 25%,#1c1d23 0% 50%) 50%/28px 28px}canvas{display:block;width:100%;height:100%}.portrait main{width:min(440px,100%,calc((100dvh - 160px)*9/16))}.portrait .stage{aspect-ratio:9/16}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 4px 0;color:#a3a3ae;font-size:13px}.controls button,.controls select{font:inherit;color:#eeeeef;background:#17181e;border:1px solid #363740;border-radius:7px;padding:9px 12px}.controls input[type=range]{flex:1;min-width:110px;accent-color:#a09afb}.controls output{font-variant-numeric:tabular-nums;min-width:76px}.controls label{display:flex;align-items:center;gap:6px}.controls :focus-visible{outline:2px solid #a09afb;outline-offset:4px}.bare{padding:0;min-height:0;display:block}.bare main{width:100%;max-width:none}.bare .controls{display:none}.bare .stage{background:transparent}@media(max-width:600px){body{padding:8px}.controls{gap:8px;font-size:12px}.controls input[type=range]{min-width:80px}}
</style>
</head>
<body>
<main aria-label="Your day, brought together motion preview">
<div class="stage" id="stage"><canvas id="art" width="1800" height="1100" role="img" aria-label="Activity, nutrition and weight readings flow through Apple Health into the Count.kcal dashboard on a silver iPhone. Your day. One clear picture."></canvas></div>
<div class="controls" aria-label="Playback controls">
<button id="play" type="button">Pause</button>
<input id="timeline" type="range" aria-label="Film time" min="0" max="10" step="0.01" value="0">
<output id="time">0.0 / 10 s</output>
<select id="variant" aria-label="Composition"><option value="wide">Wide</option><option value="portrait">Portrait</option></select>
<label><input id="transparent" type="checkbox">Transparency</label>
</div>
</main>
<script src="film-preview.js"></script>
</body>
</html>

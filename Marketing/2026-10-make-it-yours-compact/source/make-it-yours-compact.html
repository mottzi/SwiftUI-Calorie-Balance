const config=JSON.parse(document.querySelector('#motion-config').textContent);

const smooth=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
function eventAt(t,duration){return config.transitions.find(tr=>t>=tr.start&&t<tr.start+duration)}
function stateAt(t){let current=0;for(const tr of config.transitions){if(t<tr.start)return {from:current,to:current,elapsed:0,moving:false};if(t<tr.end)return {from:tr.from,to:tr.to,elapsed:t-tr.start,moving:true};current=tr.to}return {from:current,to:current,elapsed:0,moving:false}}

function wavePoints(index){const s=config.layout.swatches,sx=s.x+index*(s.width+s.gap)+s.width/2,sy=s.y;
 const a={x:sx,y:sy},b={x:sx,y:730},c={x:60,y:670},d={x:240,y:460},e={x:440,y:160},f={x:900,y:180},g={x:1080,y:360};
 const pts=[];let length=0;for(let i=0;i<=200;i++){const p=i<=100?curve(a,b,c,d,i/100):curve(d,e,f,g,(i-100)/100);if(pts.length)length+=Math.hypot(p.x-pts.at(-1).x,p.y-pts.at(-1).y);pts.push({...p,length})}return {pts,length};}
const paths=config.palettes.map((_,i)=>wavePoints(i));

const mergeSurfaces=new Map();
function mergedDevice(type,a,b,p){
 if(p<=0)return a;if(p>=1)return b;
 let surface=mergeSurfaces.get(type);if(!surface){surface=document.createElement('canvas');surface.width=a.naturalWidth;surface.height=a.naturalHeight;mergeSurfaces.set(type,surface)}
 const mc=surface.getContext('2d'),w=surface.width,h=surface.height,cut=Math.round(w*p);
 mc.clearRect(0,0,w,h);mc.drawImage(a,0,0);mc.clearRect(0,0,cut,h);mc.save();mc.beginPath();mc.rect(0,0,cut,h);mc.clip();mc.drawImage(b,0,0);mc.restore();return surface;
}
function draw(t){if(!ready)return;t=((t%config.duration)+config.duration)%config.duration;
 const state=stateAt(t),active=config.states[state.to],wave=eventAt(t,config.wave.duration);

 if(wave){const elapsed=t-wave.start,palette=config.palettes[config.states[wave.to].palette],path=paths[config.states[wave.to].palette];
  const head=smooth(elapsed/config.wave.travel)*path.length,fade=smooth(elapsed/.1)*(1-smooth((elapsed-.5)/.4));ctx.lineCap='round';ctx.lineJoin='round';
  if(segment(path,0,head)){ctx.lineWidth=config.wave.width;ctx.strokeStyle=gradient(palette.colors,config.wave.bodyOpacity*fade);ctx.stroke()}
  if(segment(path,Math.max(0,head-path.length*.24),head)){ctx.lineWidth=config.wave.coreWidth;ctx.strokeStyle=gradient(palette.colors,config.wave.coreOpacity*fade);ctx.stroke()}
 }
 function device(type){const box=config.layout[type],a=images.get(config.states[state.from][type]),b=images.get(config.states[state.to][type]);const h=box.height,w=h*a.naturalWidth/a.naturalHeight,lift=bounce(t,type),scale=1+config.bounce.scaleAmount*lift;

  ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,18);ctx.clip();ctx.fillStyle=palette.colors[0];ctx.fillRect(-w/2,-h/2,w,h);
  ctx.beginPath();ctx.moveTo(w*.08,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(-w*.08,h/2);ctx.closePath();ctx.fillStyle=palette.colors[1];ctx.fill();ctx.restore();
 });ctx.restore();

}
function schedule(){if(!raf&&ready&&playing&&visible&&!document.hidden)raf=requestAnimationFrame(tick)}
function tick(now){raf=0;if(!playing||!visible||document.hidden){last=0;return}if(last)time=(time+Math.min(.1,(now-last)/1000))%config.duration;last=now;draw(time);schedule()}

play.addEventListener('click',()=>setPlaying(!playing));timeline.addEventListener('input',()=>seek(Number(timeline.value)));
for(const button of document.querySelectorAll('.palette'))button.addEventListener('click',()=>seek(Number(button.dataset.time)));
const size=document.querySelector('#size');function setSize(value){document.querySelector('#composition').style.maxWidth=value==='auto'?'820px':value+'px'}size.addEventListener('change',()=>setSize(size.value));if(['320','390'].includes(params.get('width'))){size.value=params.get('width');setSize(size.value)}
reduced.addEventListener('change',e=>{if(e.matches)seek(0)});document.addEventListener('visibilitychange',()=>{last=0;schedule()});
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;last=0;schedule()},{threshold:.35}).observe(canvas);
async function load(){await Promise.all([...new Set(config.states.flatMap(s=>[s.phone,s.watch]))].map(path=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{images.set(path,img);resolve()};img.onerror=()=>reject(new Error(path));img.src=path})));ready=true;setPlaying(playing);draw(time);document.body.dataset.ready='true'}
load().catch(error=>{console.error(error);document.querySelector('#note').textContent='Keep this source beside the linked Today and Watch collections so the images can load.'});

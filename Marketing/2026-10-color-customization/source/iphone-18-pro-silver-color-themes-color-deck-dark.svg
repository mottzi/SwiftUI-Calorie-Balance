  <title>Count.kcal color deck, dark mode, six silver iPhones</title>
  <desc>Six original framed iPhone 18 Pro screenshots in dark appearance form a layered color sample deck. Theme 09 is the large foreground phone. Behind it, themes 04, 05, 08, 02 and 01 increase in size from left to right. Transparent background. Midnight, Marketing Mode, dark background setting, Steps off, streak highlight mid-sweep.</desc>
